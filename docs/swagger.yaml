basePath: /
definitions:
  entity.Task:
    properties:
      assignee:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      status:
        $ref: '#/definitions/entity.TaskStatus'
      title:
        type: string
      updated_at:
        type: string
    type: object
  entity.TaskStatus:
    enum:
