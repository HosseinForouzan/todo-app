services:
    app:
        build: .
        container_name: graph-app
        ports:
            - "8080:8080"
            - "6060:6060"
        depends_on:
            - postgres
            - redis
        environment:
            - DB_HOST=postgres
            - DB_PORT=5432
            - REDIS_HOST=redis
            - REDIS_PORT=6379
    postgres:
        image: postgres:16
        container_name: task
        restart: unless-stopped
        environment:
            POSTGRES_USER: myuser
            POSTGRES_PASSWORD: secret
            POSTGRES_DB: task_db
        ports:
            - "5431:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
    
    redis:
        image: redis:7-alpine
        container_name: todo-redis
        ports:
            - "6380:6379"


    



 
volumes:
    postgres_data:
    


